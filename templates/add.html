<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>➕ Add New Student</h2>
    <a href="{{ url_for('index') }}" class="btn btn-secondary mb-3">⬅️ Back to Home</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('add_student') }}" method="POST" class="card p-4 shadow-sm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" name="student_id" class="form-control" required placeholder="e.g. STU-101">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required placeholder="John Doe">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required placeholder="student@email.com">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" required placeholder="+92 300 1234567">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Department</label>
                <select name="department" id="department" class="form-select" required onchange="renderSubjects()">
                    <option value="">Select Department</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Semester</label>
                <input type="number" name="semester" class="form-control" min="1" max="8" required placeholder="1-8">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" min="0" max="4.0" name="cgpa" class="form-control" required placeholder="0.00 - 4.00">
            </div>
        </div>

        <!-- Dynamic Departmental Subject Marks Container -->
        <hr>
        <div id="subjects_container" class="mb-3">
            <p class="text-muted">Please select a department to load subject marks fields.</p>
        </div>

        <button type="submit" class="btn btn-primary w-100">Save Student</button>
    </form>

    <script>
    const departmentSubjects = {
        "Data Science": ["Python", "Statistics", "Machine Learning", "Linear Algebra"],
        "Computer Science": ["Programming Fundamentals", "Data Structures", "DBMS", "OS"],
        "Software Engineering": ["Software Design", "SQA", "Web Engineering", "DBMS"],
        "Information Technology": ["Networking", "Cyber Security", "Web Tech", "Cloud Computing"]
    };

    function renderSubjects() {
        const dept = document.getElementById("department").value;
        const container = document.getElementById("subjects_container");
        container.innerHTML = "";

        if (dept && departmentSubjects[dept]) {
            container.innerHTML = `<h5 class="mb-3">Subject Marks for ${dept} (out of 100):</h5><div class="row" id="subjects_grid"></div>`;
            const grid = document.getElementById("subjects_grid");

            departmentSubjects[dept].forEach(sub => {
                grid.innerHTML += `
                    <div class="col-md-6 mb-3">
                        <label class="form-label">${sub}:</label>
                        <input type="number" step="0.01" min="0" max="100" class="form-control" name="marks[${sub}]" placeholder="${sub} Marks" required>
                    </div>
                `;
            });
        } else {
            container.innerHTML = '<p class="text-muted">Please select a department to load subject marks fields.</p>';
        }
    }
    </script>
</body>
</html>
