<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-warning text-dark py-3">
                        <h4 class="mb-0">✏️ Edit Student (ID: {{ student.student_id }})</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone</label>
                                    <input type="text" name="phone" class="form-control" value="{{ student.phone }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Department</label>
                                    <select name="department" class="form-select" required>
                                        <option value="Data Science" {% if student.department == 'Data Science' %}selected{% endif %}>Data Science</option>
                                        <option value="Computer Science" {% if student.department == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                                        <option value="Software Engineering" {% if student.department == 'Software Engineering' %}selected{% endif %}>Software Engineering</option>
                                        <option value="Information Technology" {% if student.department == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Semester</label>
                                    <input type="number" name="semester" min="1" max="8" class="form-control" value="{{ student.semester }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">CGPA</label>
                                    <input type="number" step="0.01" name="cgpa" min="0" max="4" class="form-control" value="{{ student.CGPA }}" required>
                                </div>
                            </div>

                            <h5 class="text-secondary border-bottom pb-2 mt-4">Subject Marks (0-100)</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4"><label>Python</label><input type="number" name="python" class="form-control" value="{{ student.marks.get('Python', 0) }}" required></div>
                                <div class="col-md-4"><label>DBMS</label><input type="number" name="dbms" class="form-control" value="{{ student.marks.get('DBMS', 0) }}" required></div>
                                <div class="col-md-4"><label>Statistics</label><input type="number" name="statistics" class="form-control" value="{{ student.marks.get('Statistics', 0) }}" required></div>
                                <div class="col-md-4"><label>Mathematics</label><input type="number" name="math" class="form-control" value="{{ student.marks.get('Mathematics', 0) }}" required></div>
                                <div class="col-md-4"><label>Calculus</label><input type="number" name="calculus" class="form-control" value="{{ student.marks.get('Calculus', 0) }}" required></div>
                                <div class="col-md-4"><label>DLD</label><input type="number" name="dld" class="form-control" value="{{ student.marks.get('DLD', 0) }}" required></div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">Update Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
