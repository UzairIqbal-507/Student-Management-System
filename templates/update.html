<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2>✏️ Update Student Details</h2>
    <a href="{{ url_for('index') }}" class="btn btn-secondary mb-3">⬅️ Back to Home</a>

    <form action="{{ url_for('update_student', student_id=student.student_id) }}" method="POST" class="card p-4 shadow-sm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Student ID (Cannot be changed)</label>
                <input type="text" class="form-control" value="{{ student.student_id }}" disabled>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ student.phone }}" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Department</label>
                <select name="department" id="department" class="form-select" required onchange="renderSubjects()">
                    <option value="Data Science" {% if student.department == 'Data Science' %}selected{% endif %}>Data Science</option>
                    <option value="Computer Science" {% if student.department == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                    <option value="Software Engineering" {% if student.department == 'Software Engineering' %}selected{% endif %}>Software Engineering</option>
                    <option value="Information Technology" {% if student.department == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Semester</label>
                <input type="number" name="semester" class="form-control" min="1" max="8" value="{{ student.semester }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" min="0" max="4.0" name="cgpa" class="form-control" value="{{ student.CGPA }}" required>
            </div>
        </div>

        <hr>
        <div id="subjects_container" class="mb-3"></div>

        <button type="submit" class="btn btn-warning w-100">Update Student Data</button>
    </form>

    <script>
    const existingMarks = {{ student.marks | tojson | safe }};
    const departmentSubjects = {
        "Data Science": ["Python", "Statistics", "Machine Learning", "Linear Algebra"],
        "Computer Science": ["Programming Fundamentals", "Data Structures", "DBMS", "OS"],
        "Software Engineering": ["Software Design", "SQA", "Web Engineering", "DBMS"],
        "Information Technology": ["Networking", "Cyber Security", "Web Tech", "Cloud Computing"]
    };

    function renderSubjects() {
        const dept = document.getElementById("department").value;
        const container = document.getElementById("subjects_container");
        container.innerHTML = "";

        if (dept && departmentSubjects[dept]) {
            container.innerHTML = `<h5 class="mb-3">Subject Marks for ${dept} (out of 100):</h5><div class="row" id="subjects_grid"></div>`;
            const grid = document.getElementById("subjects_grid");

            departmentSubjects[dept].forEach(sub => {
                const val = existingMarks[sub] !== undefined ? existingMarks[sub] : 0;
                grid.innerHTML += `
                    <div class="col-md-6 mb-3">
                        <label class="form-label">${sub}:</label>
                        <input type="number" step="0.01" min="0" max="100" class="form-control" name="marks[${sub}]" value="${val}" required>
                    </div>
                `;
            });
        }
    }

    // Auto load on open
    window.onload = renderSubjects;
    </script>
</body>
</html>
