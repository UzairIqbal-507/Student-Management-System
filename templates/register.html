<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="m-0 fw-bold">📝 Create Account</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Account Role</label>
                                <select name="role" class="form-select">
                                    <option value="student">Student</option>
                                    <option value="admin">Teacher / Admin</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Student ID (Optional for Students)</label>
                                <input type="text" name="student_id" class="form-control" placeholder="e.g. 1, 2">
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold">Register</button>
                        </form>
                        <div class="text-center mt-3">
                            <small class="text-muted">Already registered? <a href="/login">Login here</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
